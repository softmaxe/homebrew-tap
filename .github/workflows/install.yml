name: Verify public installation

on:
  workflow_dispatch:

permissions: {}

jobs:
  install:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - name: Install from the public tap
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew update
          brew tap softmaxe/tap
          brew trust softmaxe/tap
          for formula in ferry gbat; do
            brew install "softmaxe/tap/$formula"
            brew test "softmaxe/tap/$formula"
            brew list --versions "$formula"
          done
          for cask in quota-bar whisper; do
            brew install --cask "softmaxe/tap/$cask"
            brew list --cask --versions "$cask"
          done
          codesign --verify --deep --strict /Applications/QuotaBar.app
          codesign --verify --deep --strict /Applications/Whisper.app
